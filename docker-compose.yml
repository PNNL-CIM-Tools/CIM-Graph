# Local development and integration testing only. Not a production deployment.
version: '2'

services:

  neo4j-apoc:
    image: neo4j:5.22-community
    ports:
      - 127.0.0.1:7474:7474
      - 127.0.0.1:7687:7687
    environment:
      - NEO4J_PLUGINS= ["apoc", "n10s"]
      - NEO4J_AUTH=neo4j/test1234  # matches tests/test_neo4j.py
      - NEO4J_dbms_memory_transaction_total_max=10g
      - NEO4J_server_memory_heap_max__size=10g
      # cimgraph uploads with n10s.rdf.import.inline, so APOC never needs server file access
      - NEO4J_apoc_export_file_enabled=false
      - NEO4J_apoc_import_file_enabled=false
    volumes:
      - ./docker/neo4j/data:/data
      - ./docker/neo4j/plugins:/plugins
