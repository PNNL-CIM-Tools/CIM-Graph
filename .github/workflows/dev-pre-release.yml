---
name: Pre-Release Package

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      force:
        description: 'Force deploy'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for changed Python files
        id: changed-files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A diff that can't run (no previous commit, e.g. a manual run) counts as changed
          if git diff --quiet "$BEFORE" "$AFTER" -- '*.py'; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          fi
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: [check-changes, ci]
    if: needs.check-changes.outputs.any_changed == 'true' || github.event.inputs.force == 'true'
    permissions:
      contents: write  # push the version commit and create the GitHub release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Bump version
        id: bump-version
        run: |
          echo "Bumping version..."

          # Get current version from pyproject.toml
          CURRENT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "From: $CURRENT_VERSION"

          # Parse version and bump prerelease
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH_AND_PRE="${VERSION_PARTS[2]}"

          # Check if already a prerelease
          if [[ $PATCH_AND_PRE == *"a"* ]]; then
            # Extract patch and prerelease number
            PATCH="${PATCH_AND_PRE%%a*}"
            PRE="${PATCH_AND_PRE##*a}"
            NEW_PRE=$((PRE + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}a${NEW_PRE}"
          else
            # First prerelease
            PATCH="$PATCH_AND_PRE"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}a0"
          fi

          echo "To: $NEW_VERSION"

          # Update pyproject.toml
          sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml

          NEW_TAG="v${NEW_VERSION}"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Build package
        run: |
          uv build

      - name: Commit bumped version
        run: |
          git config --global user.name 'gridappsd[bot]'
          git config --global user.email 'gridappsd[bot]@users.noreply.github.com'
          NEW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          git commit -am "Bump version to $NEW_VERSION"
          git push origin develop

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: "dist/*.gz,dist/*.whl"
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          commit: ${{ github.ref }}
          prerelease: true
          tag: ${{ env.NEW_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    # Separate job so only this one, which runs no build code, can mint a PyPI token
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC); no long-lived API token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
