---
name: Release

# Every merge to develop publishes the next pre-release (0.6.0a1 -> 0.6.0a2) and every merge to
# main the stable version (0.6.0a2 -> 0.6.0); .github/scripts/release_version.sh has the rules.
# A run computes the new version, tags the triggering commit, creates the GitHub release and
# publishes to PyPI.
# Pushes that change no Python file or pyproject.toml are skipped; a manual run on develop or
# main always releases.
#
# PyPI Trusted Publishing must name this file (release.yml) and the environment pypi.

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

# One release per branch at a time, so each run bumps the version the previous one committed
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CIM_PROFILES_REF: rc2  # as in ci.yml: uv.lock is re-locked against this checkout

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.changes.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changed Python files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A diff that can't run (no previous commit, e.g. a new branch) counts as changed
          if [[ $EVENT == workflow_dispatch ]] || ! git diff --quiet "$BEFORE" "$AFTER" -- '*.py' pyproject.toml; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: check-changes
    if: needs.check-changes.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write  # create the GitHub release
    steps:
      - name: Checkout CIM-Graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: CIM-Graph
          fetch-depth: 0  # tags, for release_version.sh
          persist-credentials: false

      - name: Checkout CIM-Profiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: PNNL-CIM-Tools/CIM-Profiles
          ref: ${{ env.CIM_PROFILES_REF }}
          path: CIM-Profiles
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set version
        id: version
        working-directory: CIM-Graph
        run: echo "version=$(bash .github/scripts/release_version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Build package
        working-directory: CIM-Graph
        run: uv build

      - name: Create GitHub release
        working-directory: CIM-Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ github.ref_name == 'develop' }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.whl --target "$SHA" \
            --generate-notes --prerelease="$PRERELEASE"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: CIM-Graph/dist/

  publish:
    # Separate job so only this one, which runs no build code, can mint a PyPI token
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC); no long-lived API token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
