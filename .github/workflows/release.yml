---
name: Release

# Every merge to develop publishes the next alpha of the version in pyproject.toml
# (0.6.0 -> 0.6.0a2, 0.6.0a3, ...) and every merge to main publishes that version (0.6.0).
# The version is computed from what is already released and never committed, so nothing
# pushes to the protected branches; .github/scripts/release_version.sh has the rules.
# Pushes that change neither the package nor pyproject.toml are skipped; a manual run on
# develop or main always releases.
#
# PyPI Trusted Publishing must name this file (release.yml) and the environment pypi.

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'cimgraph/**'
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

# One release per branch at a time, so each run sees the versions the previous one released
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # tags, for release_version.sh
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set version
        id: version
        run: |
          version=$(bash .github/scripts/release_version.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    # Separate job so only this one, which runs no build code, can mint a PyPI token
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC); no long-lived API token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    # After PyPI, so a v* tag only exists for a version that was published
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write  # create the tag and the GitHub release
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ github.ref_name == 'develop' }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.whl --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --generate-notes --prerelease="$PRERELEASE"
