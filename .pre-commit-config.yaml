repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    args: [--unsafe]  # mkdocs.yml uses !!python/name tags
  - id: double-quote-string-fixer
  - id: check-json
  - id: check-toml
  - id: check-xml
  - id: forbid-new-submodules
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-merge-conflict
  - id: check-added-large-files  # new files over 500 kB (large test models belong outside git)
  - id: no-commit-to-branch  # blocks main commits.  To bypass do git commit --allow-empty

- repo: https://github.com/PyCQA/isort
  rev: 8.0.0
  hooks:
  - id: isort
    name: isort
    description: "A Python utility / library to sort imports."
    entry: isort
    language: python
    types: [ python ]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.4
  hooks:
  - id: ruff-check
    # Syntax errors and undefined names only, as in CI, until the WS5 lint clean-up
    args: [--select, 'E9,F63,F7,F82']
