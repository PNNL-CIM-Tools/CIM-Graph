[project]
name = "cim-graph"
version = "0.6.0a1"
description = "CIM Graph"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"},
    {name = "C. Allwardt", email = "3979063+craig8@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "BSD-3-Clause"}
keywords = ["cim", "power-systems", "graph", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # CIM profiles, Identity and units; versioned separately (pins loosen at 1.0)
    "cimprofiles>=0.1.0a1,<0.2",
    "defusedxml>=0.7.1",
    # utils.mermaid renders diagrams through mermaid.ink
    "requests>=2.31",
]

# Database drivers, one extra per connection family. XMLFile, JSONLDFile and
# SPARQLEndpointConnection need none of them.
[project.optional-dependencies]
sparql = ["SPARQLWrapper>=2.0.0"]                    # BlazegraphConnection, GraphDBConnection
neo4j = ["neo4j>=5.10.0", "nest-asyncio>=1.5.8"]     # Neo4jConnection
mysql = ["mysql-connector-python>=9.2.0"]            # MySQLConnection
gridappsd = ["gridappsd-python>=2026.2.1"]           # GridappsdConnection
rdflib = ["rdflib>=7.0.0", "oxrdflib>=0.3.6"]        # RDFlibConnection, cimgraph.shacl
all = ["cim-graph[sparql,neo4j,mysql,gridappsd,rdflib]"]
dev = [
    "cim-graph[all]",
    "pytest>=8.3.5",
    "pre-commit>=2.17.0",
    "graphviz>=0.19.1",
    "ipykernel>=6.27.1",
]

[project.urls]
Homepage = "https://github.com/PNNL-CIM-Tools/CIM-Graph"
Documentation = "https://pnnl-cim-tools.github.io/CIM-Graph/"
Repository = "https://github.com/PNNL-CIM-Tools/CIM-Graph"
Issues = "https://github.com/PNNL-CIM-Tools/CIM-Graph/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cimgraph"]

# Local development against a CIM-Profiles checkout next to this repo.
# REMOVE before publishing cim-graph: it must resolve cimprofiles from PyPI.
[tool.uv.sources]
cimprofiles = { path = "../CIM-Profiles", editable = true }

[tool.hatch.build.targets.sdist]
include = [
    "/cimgraph",
    "README.md",
    "LICENSE",
]

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**",
    "docker/**",
    "cimgraph/data_profile/**",
    "!*.py"
]

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true

[tool.isort]
line_length = 99
